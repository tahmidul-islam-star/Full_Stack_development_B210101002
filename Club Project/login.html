<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login | CSTU Computer & Programming Club</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>
<body>
<header class="header">
  <div class="brand">
    <div class="logo">💻</div>
    <div class="brand-text">
      <h1>CSTU Computer & Programming Club</h1>
      <p>Code • Learn • Build • Lead</p>
    </div>
  </div>
  <div id="authArea" class="auth-area">
    <button id="logoutBtn" class="btn small ghost" style="display:none" onclick="logout()">Logout</button>
  </div>
</header>

<nav class="nav">
  <a href="login.html" class="nav-link">Login</a>
  <a href="advisor.html" class="nav-link">Advisor Panel</a>
  <a href="executive.html" class="nav-link">Executive</a>
  <a href="notice.html" class="nav-link">Notice</a>
  <a href="members.html" class="nav-link">Members</a>
  <a href="contest.html" class="nav-link">Contest</a>
</nav>

<main class="container">
  <section class="panel active">
    <h2>Member Login</h2>
    <div class="form-row">
      <input id="userid" type="text" placeholder="Enter your full name">
    </div>
    <div class="form-row">
      <input id="password" type="password" placeholder="Password">
    </div>
    <div class="form-row">
      <button class="btn" onclick="login()">Login</button>
    </div>
    <p id="loginMessage" class="message"></p>
    <p class="hint">Use your full name exactly as in the member list (case insensitive). Password: <strong>12345678</strong></p>
  </section>
</main>

<footer class="footer">
  <p>© 2026 CSTU Computer & Programming Club | Developed by Tahmidul Islam</p>
</footer>

<script src="script.js"></script>
</body>
</html>
